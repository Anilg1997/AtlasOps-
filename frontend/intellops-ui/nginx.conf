server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Root health page — always 200 so host/container health checks never
    # kill the frontend container mid-demo.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # AI Co-Pilot (SSE streaming — buffering must be off)
    location /api/v1/copilot/ {
        proxy_pass http://ai-copilot-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Order Service (REST)
    location /api/orders/ {
        proxy_pass http://order-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Inventory Service (REST)
    location /api/inventory/ {
        proxy_pass http://inventory-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Auth Service
    location /api/auth/ {
        proxy_pass http://auth-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Notification / Activity Service (activity feed)
    location /api/v1/activity {
        proxy_pass http://notification-service:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # GraphQL BFF (order-service)
    location /graphql {
        proxy_pass http://order-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
