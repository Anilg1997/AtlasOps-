# AtlasOps — Deployable demo slice
#
# Runs only the services needed for the AI co-pilot + activity feed story:
#   auth, order, inventory, ai-copilot, notification + PostgreSQL, MongoDB,
#   Ollama, seed-data (orders + feed), frontend
#
# Excluded on purpose (kept in docker-compose.yml for full local review):
#   Kafka, Oracle/SOAP billing, ChromaDB — they add deploy complexity without
#   changing the demo. The Billing MCP tool degrades gracefully when the
#   billing service is absent (see docs/decisions/005-failure-handling.md).
#   The notification service runs without Kafka: the seed-feed container
#   populates the activity timeline via REST (POST /api/v1/activity/events).
#
# Usage:
#   docker compose -f docker-compose.demo.yml up --build
#   open http://localhost:8080
#
# The demo uses a small Ollama model (llama3.2:3b) via INTELLOPS_AI_OLLAMA_MODEL
# so a fresh deployment cold-starts quickly; local/full-stack use keeps llama3.1.

name: atlasops-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Mongo@2024
    volumes:
      - demo-mongo-data:/data/db
      - ./infra/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://admin:Mongo%402024@127.0.0.1:27017/admin?authSource=admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - demo-ollama-data:/root/.ollama
    # Pull the small demo model on first boot, then keep serving.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.2:3b && ollama pull nomic-embed-text && wait"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q llama3.2:3b"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/intellops_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.order
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/intellops_order
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-service:8080
      GRPC_CLIENT_INVENTORYGRPCSERVICE_ADDRESS: inventory-service:9091
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile.inventory
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:Mongo%402024@mongodb:27017/intellops_inventory?authSource=admin
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-service:8080
      GRPC_SERVER_PORT: 9091
      SERVER_PORT: 8082
    depends_on:
      mongodb:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  ai-copilot-service:
    build:
      context: .
      dockerfile: Dockerfile.copilot
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/intellops_order
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_MONGODB_URI: mongodb://admin:Mongo%402024@mongodb:27017/intellops_copilot?authSource=admin
      INTELLOPS_AI_OLLAMA_BASE_URL: http://ollama:11434
      INTELLOPS_AI_OLLAMA_MODEL: llama3.2:3b
      INTELLOPS_BILLING_BASE_URL: http://billing-service:8084
      INTELLOPS_NOTIFICATION_BASE_URL: http://notification-service:8085
      SERVER_PORT: 8083
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "8083:8083"
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:Mongo%402024@mongodb:27017/intellops_notification?authSource=admin
      SERVER_PORT: 8085
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  seed-data:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./infra/demo/seed-demo-data.sql:/seed-demo-data.sql:ro
      - ./infra/demo/seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      order-service:
        condition: service_started
    restart: "no"

  seed-feed:
    # Curl image (alpine) — POSTs demo events to the notification service so
    # the activity feed is populated without Kafka. See infra/demo/seed-feed.sh.
    image: curlimages/curl:latest
    volumes:
      - ./infra/demo/seed-feed.sh:/seed-feed.sh:ro
    entrypoint: ["/bin/sh", "/seed-feed.sh"]
    environment:
      FEED_BASE_URL: http://notification-service:8085
    depends_on:
      notification-service:
        condition: service_started
    restart: "no"

  frontend:
    build:
      context: ./frontend/intellops-ui
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      ai-copilot-service:
        condition: service_started
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      auth-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

volumes:
  demo-postgres-data:
  demo-mongo-data:
  demo-ollama-data:
